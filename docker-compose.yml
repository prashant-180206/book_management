services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://shelfwise:shelfwise@db:5432/shelfwise
      SECRET_KEY: local-compose-secret-change-me
      CORS_ORIGINS: http://localhost:8081,http://localhost:19006
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shelfwise
      POSTGRES_USER: shelfwise
      POSTGRES_PASSWORD: shelfwise
    ports:
      - "5432:5432"
    volumes:
      - shelfwise-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelfwise -d shelfwise"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  shelfwise-data:
